<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="../../dist/index.css">
        <link rel="stylesheet" href="../../dist/PregledKnjiga/PregledKnJiga.css">
    </head>
    <body>
        <nav class="navbar">
            <h1 class="title">Online Biblioteka</h1>
            <ul class="nav-links">
                <li><a href="../contact/contact.html">Kontakt</a></li>
                <li><a href="PregledKnjiga.html">Pregled Knjiga</a></li>
                <li><a href="../Moje Knjige/MojeKnjige.html">Moje Knjige</a></li>
            </ul>
        </nav>
    <div class="main">
        <div id="contact-info">
            <h2>Online Biblioteka</h2>
            <form id="nova-knjiga-forma">
                <h3>Dodaj novu knjigu</h3>
                <label for="naziv-knjige">Naziv:</label>
                <input id="naziv-knjige" type="text" required>
                <label for="datum-stampanja">Godina štampanja:</label>
                <input id="datum-stampanja" type="number" min="1" required>
                <label for="url-slike">Putanja ili URL slike:</label>
                <input id="url-slike" type="text" required>
                <label for="opis-knjige">Opis:</label>
                <textarea id="opis-knjige" required></textarea>
                <label for="popularnost-knjige">Popularnost (1–5):</label>
                <input id="popularnost-knjige" type="number" min="1" max="5" value="1" required>
                <button id="dodaj-knjigu" type="button">Dodaj knjigu</button>
            </form>
            <div class="knjige-table">
                  <table id="knjige">
                    <thead>
                       <tr>
                          <th>Br</th>
                          <th>Naziv</th>
                          <th></th>
                          
                      </tr>
                    </thead>
                    <tbody id="knjige-body"> 
                    </tbody>
                  </table>
            </div>
            <div class="knjiga-details"></div> 
        </div> 
    
         
    </div>
    <script src="PregledKnJiga.js"></script>
    </body>
</html>
